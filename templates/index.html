<!DOCTYPE html>
<html>
<head>
    <title>Iris Flower Prediction</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            padding: 40px;
        }
        .box {
            background: white;
            padding: 20px;
            width: 350px;
            margin: 80px auto;
            border-radius: 8px;
            border: 2px solid #4CAF50;
        }
        input, button {
            width: 100%;
            padding: 8px;
            margin: 6px 0;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        h2 {
            text-align: center;
        }
        .result {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Iris Flower Predictor 🌸</h2>

        <form method="POST" action="/predict-ui">
            <input type="number" step="any" name="sepal_length" placeholder="Sepal Length" required>
            <input type="number" step="any" name="sepal_width" placeholder="Sepal Width" required>
            <input type="number" step="any" name="petal_length" placeholder="Petal Length" required>
            <input type="number" step="any" name="petal_width" placeholder="Petal Width" required>
            <button type="submit">Predict</button>
        </form>

        {% if prediction %}
            <div class="result">
                Prediction: {{ prediction }}
            </div>
        {% endif %}
    </div>
</body>
</html>
